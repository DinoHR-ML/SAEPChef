<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SAEPChef</title>
</head>

<body>
    <header>
        <div class="user_section">
            <!-- 1.1 Seção usuário:
            - Foto de perfil arredondada.
            - Nome do usuário @SAEPChef.
            - Botão "Ver Perfil":
            - Fundo #1B3C29;
            - Texto #FFF;
            - Desabilitado. -->
            <img src="./imagens_usuarios/saepChef.jpg" alt="Foto de perfil do usuário" class="perfil_img">
            <div class="user_info">
                <h3 class="user_name">@SAEPChef</h3>
                <button class="perfil_button" disabled>Ver perfil</button>
            </div>
        </div>
        <div class="enterprise_section">
            <!-- Seção empresa:
            - Nome "SAEPChef";
            - Centralizado. -->
            <h1>SAEPChef</h1>
        </div>
        <div class="login_section">
            <!-- Botão de login:
            - Fundo #1B3C29;
            - Texto #FFF;
            - Popup/modal de autenticação. -->
            <button class="login_button">Login</button>
        </div>
    </header>
    <div id="login-modal" class="modal" hidden></div>
    <nav>
        <div class="search_div">
            <!-- 2.1 Campo de busca:
            - Placeholder "Digite o nome do chef... ex: @chef1".
            - Ícone de lupa.svg à direita. -->
            <input type="search" placeholder="Digite o nome do chef" class="search_bar">
        </div>
    </nav>
    <main>
        <div class="mural_div">
            <div class="recipe">
                <img src="/receitas/receita1.jpg" alt="Imagem da receita" class="recipe_img">
                <div class="recipe_infos">
                    <span class="recipe_name">Receita 1</span>
                    <span class="recipe_hidden_info">Receita publicada por: @chef1 - Origem: Itália</span>
                    <div class="recipe_favorite">
                        <label for="favorite_image">0</label>
                        <img src="icones/estrela.svg" alt="Ícone de estrela para o favorito" class="favorite_image">
                    </div>
                </div>
            </div>
            <div class="recipe">
                <img src="/receitas/receita1.jpg" alt="Imagem da receita" class="recipe_img">
                <div class="recipe_infos">
                    <span class="recipe_name">Receita 1</span>
                    <span class="recipe_hidden_info">Receita publicada por: @chef1 - Origem: Itália</span>
                    <div class="recipe_favorite">
                        <label for="favorite_image">0</label>
                        <img src="icones/estrela.svg" alt="Ícone de estrela para o favorito" class="favorite_image">
                    </div>
                </div>
            </div>
            <div class="recipe">
                <img src="/receitas/receita1.jpg" alt="Imagem da receita" class="recipe_img">
                <div class="recipe_infos">
                    <span class="recipe_name">Receita 1</span>
                    <span class="recipe_hidden_info">Receita publicada por: @chef1 - Origem: Itália</span>
                    <div class="recipe_favorite">
                        <label for="favorite_image">0</label>
                        <img src="icones/estrela.svg" alt="Ícone de estrela para o favorito" class="favorite_image">
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer_div"></div>
    </footer>
</body>

</html>
